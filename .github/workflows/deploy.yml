name: Deploy to GitHub Pages

# The site is served from the gh-pages branch (Settings > Pages). This
# workflow verifies every level still passes the solver, then fast-syncs
# main onto gh-pages so a push to main is a deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: All levels must pass the solver
        run: node tools/generate-levels.mjs
      - name: Sync main to gh-pages
        run: git push origin HEAD:gh-pages --force
